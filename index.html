<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bodegón Lumbre · Gestión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f0e8; --surface:#fffdf9; --surface2:#f9f4ec; --line:#e7ddcf; --ink:#221b16; --muted:#7c6f64;
  --side:#1e1814; --side-ink:#d9cfc4; --accent:#c2410c; --accent-soft:#fbe6d8;
  --green:#2f7d4f; --green-soft:#dcefe2; --amber:#a86a10; --amber-soft:#f8ead0; --red:#b42318; --red-soft:#fbe1de;
  --blue:#2b5f9e; --blue-soft:#dde8f6; --wa:#1f8f4e; --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"DM Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:236px 1fr;height:100vh}
/* sidebar */
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:22px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px;border-bottom:1px solid #3a302a;margin-bottom:14px}
.brand b{font-family:"Fraunces",serif;font-size:19px;color:#fff;display:block;line-height:1.1}
.brand small{font-size:11px;color:#a3958a;letter-spacing:.08em;text-transform:uppercase}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border:0;background:none;border-radius:10px;color:var(--side-ink);cursor:pointer;text-align:left;font-weight:500;margin-bottom:2px}
.nav button:hover{background:#2c241f}
.nav button.on{background:var(--accent);color:#fff}
.nav svg{width:18px;height:18px;flex:none}
.nav .cnt{margin-left:auto;background:#e8553a;color:#fff;font-size:11px;font-weight:700;border-radius:20px;padding:1px 7px}
.nav button.on .cnt{background:#fff;color:var(--accent)}
.side-foot{margin-top:auto;font-size:12px;color:#8d8075;padding:10px 8px}
.side-foot button{background:none;border:1px solid #4a3f37;color:var(--side-ink);border-radius:8px;padding:6px 10px;cursor:pointer;width:100%;margin-top:8px}
.side-foot button:hover{border-color:#8d8075}
/* main */
.main{overflow:auto;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:18px 28px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5}
.top h1{font-size:24px}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:30px;padding:5px 12px;font-size:12.5px;font-weight:600;background:var(--surface);border:1px solid var(--line);cursor:pointer;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.pill.off .dot{background:var(--red)}
.content{padding:24px 28px 60px}
/* common */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.card h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px}
.kpi span{font-size:12px;color:var(--muted);font-weight:500}
.kpi b{display:block;font-size:22px;font-family:"Fraunces",serif;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:12px}
.kpi.warn b{color:var(--red)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;text-decoration:none;color:var(--ink);font-size:13.5px}
.btn:hover{border-color:#cdbfae;background:#fff}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:#a8370a}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.danger{color:var(--red)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.toolbar .sp{flex:1}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.badge{display:inline-block;font-size:11.5px;font-weight:600;border-radius:20px;padding:2px 9px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.b-green{background:var(--green-soft);border-color:transparent;color:var(--green)}
.b-red{background:var(--red-soft);border-color:transparent;color:var(--red)}
.b-amber{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.b-blue{background:var(--blue-soft);border-color:transparent;color:var(--blue)}
.b-acc{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.b-wa{background:#dcf3e4;color:var(--wa);border-color:transparent}
table{width:100%;border-collapse:collapse}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid #f0e8dc;vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface2)}
input[type=text],input[type=number],input[type=time],input[type=tel],select,textarea{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:12px}
label.f>input,label.f>select,label.f>textarea{margin-top:5px;color:var(--ink);font-weight:400}
.search{max-width:260px}
.tabs{display:flex;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:3px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted);font-size:13px}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:13px}
.bar{height:8px;background:var(--surface2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--green);border-radius:6px}
.bar.low i{background:var(--red)}
.hbar{display:grid;grid-template-columns:110px 1fr 90px;align-items:center;gap:10px;margin-bottom:9px;font-size:13px}
.hbar .t{height:14px;background:var(--surface2);border-radius:5px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--accent);border-radius:5px}
.list-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f0e8dc}
.list-item:last-child{border-bottom:0}
.list-item .sp{flex:1;min-width:0}
.banner{background:var(--red-soft);color:var(--red);border-radius:12px;padding:11px 16px;margin-bottom:18px;display:flex;align-items:center;gap:12px;font-weight:600}
.banner .sp{flex:1}
/* mesas */
.zona{font-family:"Fraunces",serif;font-size:15px;margin:6px 0 10px;color:var(--muted)}
.mesas{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px;margin-bottom:22px}
.mesa{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;cursor:pointer;border-top:5px solid #cfc4b6;transition:transform .12s,box-shadow .12s;min-height:118px;display:flex;flex-direction:column}
.mesa:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(60,40,20,.08)}
.mesa .n{font-family:"Fraunces",serif;font-size:22px;display:flex;align-items:center;justify-content:space-between}
.mesa .meta{font-size:12px;color:var(--muted);margin-top:auto}
.mesa .tot{font-weight:700;font-size:15px;margin-top:4px}
.mesa.ocupada{border-top-color:var(--accent)}
.mesa.cuenta{border-top-color:var(--amber);background:#fffaf0}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* kanban */
.kan{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
.col{background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius);padding:12px;min-height:200px}
.col h4{margin:2px 4px 12px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:flex;justify-content:space-between}
.ped{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;animation:pop .3s ease}
.ped.fresh{box-shadow:0 0 0 2px var(--accent)}
.ped .h{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.ped .h b{font-size:15px}
.ped .it{font-size:12.5px;color:#4d433b;margin:6px 0}
.ped .f{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
/* modal */
.ov{position:fixed;inset:0;background:rgba(30,24,20,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.ov.show{display:flex}
.modal{background:var(--surface);border-radius:18px;width:min(520px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.25);animation:pop .18s ease}
.modal.wide{width:min(1060px,100%)}
.modal.mid{width:min(720px,100%)}
.mh{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.mh h2{font-size:20px;flex:1}
.mh .x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.mb{padding:20px 22px}
.mf{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--line);background:var(--surface2);border-radius:0 0 18px 18px}
/* editor */
.ed-body{display:grid;grid-template-columns:1fr 340px;gap:18px}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px;max-height:56vh;overflow:auto;padding:2px}
.prod{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px;cursor:pointer;text-align:left}
.prod:hover{border-color:var(--accent);background:#fffaf6}
.prod b{display:block;font-size:13.5px;font-weight:600;line-height:1.25;min-height:34px}
.prod span{color:var(--accent);font-weight:700;font-size:13px}
.prod small{display:block;color:var(--muted);font-size:11px}
.ticket{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;max-height:66vh}
.ticket .items{overflow:auto;flex:1;min-height:80px}
.ti{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:700;line-height:1}
.tl{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
.tl.d{color:var(--green)}
.tl.tot{font-size:20px;font-weight:700;font-family:"Fraunces",serif;border-top:1px solid var(--line);margin-top:6px;padding-top:9px}
.medios{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}
.medios button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer;font-weight:600}
.medios button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* promos */
.promo{display:flex;gap:14px;align-items:flex-start}
.promo .ic{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}
.sw{position:relative;width:40px;height:22px;flex:none;cursor:pointer}
.sw input{display:none}
.sw span{position:absolute;inset:0;background:#d6cbbd;border-radius:20px;transition:.2s}
.sw span:after{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--green)}
.sw input:checked+span:after{transform:translateX(18px)}
.dias{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.dias label{border:1px solid var(--line);border-radius:8px;padding:5px 9px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--ink);background:#fff}
.dias input{display:none}
.dias label:has(input:checked){background:var(--ink);color:#fff;border-color:var(--ink)}
/* toast */
.toasts{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:10px;z-index:80}
.toast{background:var(--side);color:#fff;border-radius:12px;padding:12px 16px;min-width:260px;max-width:360px;box-shadow:0 12px 30px rgba(0,0,0,.25);animation:pop .25s ease;cursor:pointer;font-size:13.5px;border-left:4px solid var(--accent)}
.toast.ok{border-left-color:#3fb26f}.toast.err{border-left-color:#ef4444}.toast.warn{border-left-color:#f0a43a}
.chip{display:inline-block;background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:1px 7px;font-size:12px;margin:2px 3px 2px 0}
.msgprev{white-space:pre-wrap;background:#e7f6ec;border-radius:12px;padding:14px;font-size:13.5px;border:1px solid #c8e8d3}
@media (max-width:1200px){.g6{grid-template-columns:repeat(3,1fr)}.kan{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34"><rect width="34" height="34" rx="10" fill="#c2410c"/><path d="M17 7c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-3-1-6 1-9z" fill="#fff"/></svg>
      <div><b>Bodegón Lumbre</b><small>Gestión gastronómica</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      Maqueta interactiva · datos de ejemplo guardados en este navegador.
      <button onclick="window.open('pedir.html','_blank')">🛍 Ver tienda del cliente ↗</button>
      <button onclick="resetDemo()">↺ Reiniciar demo</button>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <h1 id="title">Inicio</h1>
      <div class="sp"></div>
      <span class="pill" id="clock" onclick="go('promos')"></span>
      <span class="pill" id="cajaPill" onclick="go('caja')"></span>
    </header>
    <div class="content" id="view"></div>
  </div>
</div>
<div class="ov" id="ov" onmousedown="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<div class="toasts" id="toasts"></div>

<script src="core.js"></script>
<script>
/* ============ constantes ============ */
const CAT_GASTO=['Insumos','Servicios','Sueldos','Mantenimiento','Alquiler','Otros'];
const ESTADOS=[['nuevo','Nuevos'],['cocina','En cocina'],['listo','Listos'],['enviado','En camino / A retirar']];
const MOZOS=['Lucas','Martina','Diego','Sofía'];
const ICONS={
 inicio:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 salon:'<circle cx="12" cy="12" r="4"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>',
 pedidos:'<path d="M5 7h14l-1.5 12a2 2 0 0 1-2 1.8h-7a2 2 0 0 1-2-1.8z"/><path d="M9 7a3 3 0 0 1 6 0"/>',
 caja:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/>',
 stock:'<path d="M3 7l9-4 9 4-9 4z"/><path d="M3 7v10l9 4 9-4V7M12 11v10"/>',
 prov:'<path d="M3 17V6h11v11M14 9h4l3 4v4h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
 promos:'<path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.5"/>'
};
const NAV=[['inicio','Inicio'],['salon','Salón'],['pedidos','Pedidos online'],['caja','Caja'],['stock','Stock'],['prov','Proveedores'],['promos','Promociones']];

function resetDemo(){if(confirm('¿Reiniciar la demo? Se borran los cambios y vuelven los datos de ejemplo.')){S=seed();save();load();closeModal();render();toast('Demo reiniciada','ok')}}
HOOKS.lowStock=i=>setTimeout(()=>toast(`⚠ Stock bajo: ${i.nombre} (${fq(i.stock)} ${i.unidad}). Se sumó a pedidos sugeridos.`,'warn',()=>go('prov')),400);
// la tienda online (pedir.html) escribe en el mismo almacenamiento: refrescar al instante
window.addEventListener('storage',e=>{if(e.key!==KEY)return;const prev=new Set(S.pedidos.map(p=>p.id)),view=S.view;load();S.view=view;
 S.pedidos.filter(p=>!prev.has(p.id)).forEach(p=>{freshId=p.id;toast(`🔔 Nuevo pedido #${p.num} desde la tienda online · ${money(p.total)}`,'',()=>go('pedidos'))});
 if(!document.getElementById('ov').classList.contains('show'))render()});

/* ============ operaciones ============ */
const turno=()=>S.movs.filter(m=>m.ts>=S.caja.apertura);
function needCaja(){if(!S.caja.abierta){toast('La caja está cerrada. Abrila para registrar movimientos.','err');return false}return true}
function saldoProv(p){return p.cta.reduce((a,m)=>a+(m.tipo==='factura'?m.monto:-m.monto),0)}
function efectivoEsperado(){const t=turno();return S.caja.inicial+t.filter(m=>m.medio==='Efectivo').reduce((a,m)=>a+(m.tipo==='venta'?m.monto:-m.monto),0)}

/* ============ UI base ============ */
function toast(msg,type='',onclick){const el=document.createElement('div');el.className='toast '+type;el.innerHTML=msg;
 el.onclick=()=>{onclick&&onclick();el.remove()};document.getElementById('toasts').appendChild(el);setTimeout(()=>el.remove(),5200)}
function openModal(title,body,foot='',size=''){document.getElementById('modal').className='modal '+size;
 document.getElementById('modal').innerHTML=`<div class="mh"><h2>${title}</h2><button class="x" onclick="closeModal()">×</button></div><div class="mb">${body}</div>${foot?`<div class="mf">${foot}</div>`:''}`;
 document.getElementById('ov').classList.add('show')}
function closeModal(){document.getElementById('ov').classList.remove('show')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function go(v){S.view=v;save();render();document.querySelector('.main').scrollTop=0}

function render(){
 const low=S.insumos.filter(i=>i.stock<i.min).length,nuevos=S.pedidos.filter(p=>p.estado==='nuevo').length,cuentas=S.mesas.filter(m=>m.estado==='cuenta').length;
 const cnt={pedidos:nuevos,stock:low,salon:cuentas};
 document.getElementById('nav').innerHTML=NAV.map(([k,n])=>`<button class="${S.view===k?'on':''}" onclick="go('${k}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>${n}${cnt[k]?`<span class="cnt">${cnt[k]}</span>`:''}</button>`).join('');
 document.getElementById('title').textContent=NAV.find(n=>n[0]===S.view)[1];
 const cp=document.getElementById('cajaPill');cp.className='pill'+(S.caja.abierta?'':' off');
 cp.innerHTML=`<span class="dot"></span>${S.caja.abierta?'Caja abierta desde '+hhmm(S.caja.apertura):'Caja cerrada'}`;
 renderClock();
 document.getElementById('view').innerHTML=VIEWS[S.view]();
}
function renderClock(){const dh=getDH();document.getElementById('clock').innerHTML=`🕒 ${DIAS[dh.dia]} ${dh.hora}${S.sim?' <span class="badge b-amber">simulado</span>':''}`}
setInterval(()=>{if(!S.sim)renderClock()},20000);

/* ============ VISTAS ============ */
const VIEWS={};

/* ---------- INICIO ---------- */
VIEWS.inicio=()=>{
 const t=turno(),ventas=t.filter(m=>m.tipo==='venta');
 const vt=ventas.reduce((a,m)=>a+m.monto,0),gt=t.filter(m=>m.tipo==='gasto').reduce((a,m)=>a+m.monto,0),pp=t.filter(m=>m.tipo==='pago_prov').reduce((a,m)=>a+m.monto,0);
 const ocup=S.mesas.filter(m=>m.estado!=='libre').length,act=S.pedidos.filter(p=>p.estado!=='entregado').length;
 const low=S.insumos.filter(i=>i.stock<i.min),deuda=S.proveedores.reduce((a,p)=>a+saldoProv(p),0);

 const ve=t.filter(m=>m.tipo==='venta'&&m.medio==='Efectivo').reduce((a,m)=>a+m.monto,0),ee=t.filter(m=>m.tipo!=='venta'&&m.medio==='Efectivo').reduce((a,m)=>a+m.monto,0);

 const low=S.insumos.filter(i=>i.stock<i.min),valor=S.insumos.reduce((a,i)=>a+i.stock*i.costo,0);
 const head=`<div class="grid g4" style="margin-bottom:16px"><div class="kpi"><span>Insumos</span><b>${S.insumos.length}</b><small>controlados</small></div>

  <input type="text" class="search" placeholder="Buscar insumo…" value="${esc(stockQ)}" oninput="stockQ=this.value;clearTimeout(window._q);window._q=setTimeout(()=>{render();const e=document.querySelector('.search');e.focus();e.setSelectionRange(99,99)},250)"><button class="btn pri" onclick="nuevoInsumo()">+ Insumo</button>`:''}</div>`;
 if(stockTab==='recetas')return head+`<div class="card"><table><tr><th>Producto</th><th>Receta (por unidad)</th><th class="num">Precio</th><th class="num">Costo</th><th class="num">Margen</th></tr>${S.productos.map(p=>{const costo=p.receta.reduce((a,[i,q])=>a+INS(i).costo*q,0),mg=(p.precio-costo)/p.precio*100;
  return `<tr><td><b>${p.nombre}</b><div class="muted" style="font-size:12px">${p.cat}</div></td><td>${p.receta.map(([i,q])=>`<span class="chip">${fq(q)} ${INS(i).unidad} ${INS(i).nombre}</span>`).join('')}</td><td class="num">${money(p.precio)}</td><td class="num">${money(costo)}</td><td class="num"><span class="badge ${mg>65?'b-green':mg>50?'b-amber':'b-red'}">${mg.toFixed(0)}%</span></td></tr>`}).join('')}</table></div>`;
 if(stockTab==='log')return head+`<div class="card">${S.stockLog.length?`<table><tr><th>Fecha</th><th>Insumo</th><th>Motivo</th><th class="num">Cantidad</th></tr>${S.stockLog.slice().reverse().map(l=>`<tr><td class="muted">${fecha(l.ts)} ${hhmm(l.ts)}</td><td>${esc(l.ins)}</td><td>${esc(l.motivo)}</td><td class="num" style="color:${l.d>0?'var(--green)':'var(--red)'}">${l.d>0?'+':''}${fq(l.d)} ${l.u}</td></tr>`).join('')}</table>`:'<div class="empty">Todavía no hay ajustes. Los ingresos de mercadería y mermas aparecen acá. Las ventas descuentan stock automáticamente según la receta.</div>'}</div>`;
 const list=S.insumos.filter(i=>(!soloBajo||i.stock<i.min)&&(!stockQ||i.nombre.toLowerCase().includes(stockQ.toLowerCase())));
 return head+`<div class="card"><table><tr><th>Insumo</th><th style="width:220px">Stock</th><th class="num">Mínimo</th><th>Proveedor</th><th class="num">Costo unit.</th><th class="num">Valor</th><th></th></tr>${list.map(i=>{const lo=i.stock<i.min;
  return `<tr><td><b>${esc(i.nombre)}</b> ${lo?'<span class="badge b-red">Bajo</span>':''}</td><td><div class="row" style="flex-wrap:nowrap"><div class="bar ${lo?'low':''}" style="flex:1"><i style="width:${Math.min(100,i.stock/(i.min*2)*100)}%"></i></div><span class="num" style="min-width:70px">${fq(i.stock)} ${i.unidad}</span></div></td>
  <td class="num muted">${fq(i.min)} ${i.unidad}</td><td class="muted">${PROV(i.prov)?.nombre||'—'}</td><td class="num">${money(i.costo)}</td><td class="num">${money(i.stock*i.costo)}</td>
  <td class="num"><button class="btn sm" onclick="ajustar('${i.id}')">Ajustar</button></td></tr>`}).join('')||'<tr><td colspan="7" class="empty">Sin resultados</td></tr>'}</table></div>`;
};
function ajustar(id){const i=INS(id);
 openModal(`Ajustar stock · ${esc(i.nombre)}`,`<p class="muted">Stock actual: <b>${fq(i.stock)} ${i.unidad}</b> · mínimo ${fq(i.min)} ${i.unidad}</p>
  <label class="f">Tipo de movimiento<select id="aj-t"><option value="in">Ingreso de mercadería (+)</option><option value="out">Merma / desperdicio (−)</option><option value="set">Conteo físico (fija el stock)</option></select></label>
  <div class="grid g2"><label class="f">Cantidad (${i.unidad})<input type="number" id="aj-q" step="0.1" min="0"></label><label class="f">Stock mínimo<input type="number" id="aj-min" step="0.1" value="${i.min}"></label></div>
  <label class="f">Motivo / nota<input type="text" id="aj-m" placeholder="Opcional"></label>`,
  `<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" onclick="guardarAjuste('${id}')">Guardar</button>`)}
function guardarAjuste(id){const i=INS(id),t=val('aj-t'),q=+val('aj-q'),mn=+val('aj-min');
 if(val('aj-q')!==''&&!(q>=0))return toast('Cantidad inválida','err');
 if(val('aj-q')!==''){const prev=i.stock;i.stock=t==='in'?i.stock+q:t==='out'?Math.max(0,i.stock-q):q;i.stock=+i.stock.toFixed(3);
  S.stockLog.push({ts:Date.now(),ins:i.nombre,u:i.unidad,d:+(i.stock-prev).toFixed(3),motivo:val('aj-m')||{in:'Ingreso manual',out:'Merma',set:'Conteo físico'}[t]})}
 if(mn>=0)i.min=mn;save();closeModal();render();toast('Stock actualizado','ok')}

 <div class="grid g3"><label class="f">Unidad<select id="ni-u"><option>kg</option><option>l</option><option>u</option></select></label><label class="f">Stock actual<input type="number" id="ni-s" value="0"></label><label class="f">Stock mínimo<input type="number" id="ni-m" value="0"></label></div>
 <div class="grid g2"><label class="f">Proveedor<select id="ni-p">${S.proveedores.map(p=>`<option value="${p.id}">${p.nombre}</option>`).join('')}</select></label><label class="f">Costo unitario<input type="number" id="ni-c" value="0"></label></div>`,

function sugeridos(){
 const enOrden=new Set(S.ordenes.filter(o=>o.estado==='enviada').flatMap(o=>o.items.map(i=>i.iid)));
 const g={};S.insumos.filter(i=>i.stock<i.min&&!enOrden.has(i.id)).forEach(i=>{(g[i.prov]=g[i.prov]||[]).push({iid:i.id,qty:Math.ceil(i.min*2-i.stock)})});return g}
function msgPedido(prov,items){return `Hola ${prov.contacto}! Te escribimos de Bodegón Lumbre 🔥\nQueremos hacer el siguiente pedido:\n\n${items.map(i=>`• ${fq(i.qty)} ${INS(i.iid).unidad} de ${INS(i.iid).nombre}`).join('\n')}\n\nEntrega: mañana antes de las 11 h.\n¿Nos confirmás disponibilidad y precio? ¡Gracias!`}
VIEWS.prov=()=>{
 const sg=sugeridos(),abiertas=S.ordenes.filter(o=>o.estado==='enviada');
 return `<div class="card" style="margin-bottom:16px"><h3>Pedidos sugeridos por stock mínimo <span class="badge b-acc">automático</span></h3>
  <p class="muted" style="margin:-6px 0 14px">El sistema detecta los insumos debajo del mínimo y arma el pedido para cada proveedor (cantidad sugerida = llevar al doble del mínimo).</p>

   ${items.map(i=>`<div class="list-item"><div class="sp">${INS(i.iid).nombre}<div class="muted" style="font-size:12px">hay ${fq(INS(i.iid).stock)} · mín ${fq(INS(i.iid).min)}</div></div><b>${fq(i.qty)} ${INS(i.iid).unidad}</b></div>`).join('')}
   <div class="row" style="margin-top:12px"><button class="btn wa sm" onclick="prevPedido('${pid}','wa')">WhatsApp</button><button class="btn sm" onclick="prevPedido('${pid}','mail')">Email</button></div></div>`}).join('')}</div>`
  :'<div class="empty">No hay insumos bajo mínimo sin pedir ✓</div>'}</div>
 ${abiertas.length?`<div class="card" style="margin-bottom:16px"><h3>Órdenes de compra enviadas · pendientes de recibir</h3><table><tr><th>Fecha</th><th>Proveedor</th><th>Detalle</th><th>Vía</th><th class="num">Estimado</th><th></th></tr>
  ${abiertas.map(o=>`<tr><td class="muted">${fecha(o.ts)} ${hhmm(o.ts)}</td><td><b>${PROV(o.prov).nombre}</b></td><td>${o.items.map(i=>`<span class="chip">${fq(i.qty)} ${INS(i.iid).unidad} ${INS(i.iid).nombre}</span>`).join('')}</td><td>${o.via==='wa'?'<span class="badge b-wa">WhatsApp</span>':'<span class="badge b-blue">Email</span>'}</td><td class="num">${money(o.items.reduce((a,i)=>a+i.qty*INS(i.iid).costo,0))}</td><td class="num"><button class="btn sm ok" onclick="recibir('${o.id}')">Recibir mercadería</button></td></tr>`).join('')}</table></div>`:''}
 <div class="card"><h3>Proveedores y cuenta corriente<span class="sp"></span><button class="btn sm" onclick="pagarProv()">Registrar pago</button></h3><table><tr><th>Proveedor</th><th>Rubro</th><th>Contacto</th><th class="num">Saldo adeudado</th><th></th></tr>
  ${S.proveedores.map(p=>{const s=saldoProv(p);return `<tr class="click" onclick="ctaCte('${p.id}')"><td><b>${p.nombre}</b></td><td class="muted">${p.rubro}</td><td class="muted">${p.contacto} · +${p.tel}</td><td class="num"><b style="color:${s>0?'var(--red)':'var(--green)'}">${money(s)}</b></td><td class="num"><button class="btn sm" onclick="event.stopPropagation();ctaCte('${p.id}')">Cuenta corriente</button> <button class="btn sm" onclick="event.stopPropagation();pagarProv('${p.id}')">Pagar</button></td></tr>`}).join('')}
  <tr><td colspan="3" style="text-align:right;font-weight:600">Total adeudado</td><td class="num"><b>${money(S.proveedores.reduce((a,p)=>a+saldoProv(p),0))}</b></td><td></td></tr></table></div>`;
};
function prevPedido(pid,via){const p=PROV(pid),items=sugeridos()[pid],msg=msgPedido(p,items);
 const href=via==='wa'?`https://wa.me/${p.tel}?text=${encodeURIComponent(msg)}`:`mailto:${p.email}?subject=${encodeURIComponent('Pedido Bodegón Lumbre')}&body=${encodeURIComponent(msg)}`;

function recibir(oid){const o=S.ordenes.find(x=>x.id===oid),p=PROV(o.prov);
 openModal(`Recibir mercadería · ${p.nombre}`,`<p class="muted" style="margin-top:0">Confirmá cantidades y precios reales del remito/factura.</p>
  <table><tr><th>Insumo</th><th>Cantidad</th><th>Costo unit.</th></tr>${o.items.map((i,k)=>`<tr><td>${INS(i.iid).nombre}</td><td><input type="number" id="rq${k}" value="${i.qty}" step="0.1" style="width:100px"> ${INS(i.iid).unidad}</td><td><input type="number" id="rc${k}" value="${INS(i.iid).costo}" style="width:120px"></td></tr>`).join('')}</table>
  <label class="f" style="margin-top:14px">N° de factura / remito<input type="text" id="r-fac" value="Fact. A ${String(Math.floor(Math.random()*9000+1000)).padStart(4,'0')}-${String(Math.floor(Math.random()*90000+10000)).padStart(8,'0')}"></label>`,
  `<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn ok" onclick="confirmarRecepcion('${oid}')">Ingresar al stock</button>`,'mid')}
function confirmarRecepcion(oid){const o=S.ordenes.find(x=>x.id===oid),p=PROV(o.prov);let total=0;
 o.items.forEach((i,k)=>{const x=INS(i.iid),q=+val('rq'+k)||0,c=+val('rc'+k)||x.costo;x.stock=+(x.stock+q).toFixed(3);x.costo=c;total+=q*c;S.stockLog.push({ts:Date.now(),ins:x.nombre,u:x.unidad,d:q,motivo:'Recepción '+p.nombre})});
 p.cta.push({ts:Date.now(),tipo:'factura',detalle:val('r-fac')||'Factura',monto:Math.round(total)});o.estado='recibida';save();closeModal();render();
 toast(`✓ Stock actualizado. Se cargó la factura de ${money(total)} a la cuenta corriente de ${p.nombre}`,'ok')}
function ctaCte(pid){const p=PROV(pid);let s=0;const rows=p.cta.slice().sort((a,b)=>a.ts-b.ts).map(m=>{s+=m.tipo==='factura'?m.monto:-m.monto;return{...m,s}});
 openModal(`Cuenta corriente · ${p.nombre}`,`<div class="row" style="margin-bottom:14px"><span class="muted">${p.rubro} · ${p.contacto} · +${p.tel} · ${p.email}</span></div>

  `<button class="btn" onclick="closeModal()">Cerrar</button><button class="btn pri" onclick="pagarProv('${pid}')">Registrar pago</button>`,'mid')}
function pagarProv(pid){if(!needCaja())return;pid=pid||S.proveedores.find(p=>saldoProv(p)>0)?.id||S.proveedores[0].id;
 openModal('Pago a proveedor',`<label class="f">Proveedor<select id="pp-p" onchange="document.getElementById('pp-m').value=Math.max(0,saldoProvId(this.value));document.getElementById('pp-s').textContent=money(saldoProvId(this.value))">${S.proveedores.map(p=>`<option value="${p.id}" ${p.id===pid?'selected':''}>${p.nombre}</option>`).join('')}</select></label>
  <p class="muted" style="margin-top:-4px">Saldo adeudado: <b id="pp-s">${money(saldoProv(PROV(pid)))}</b></p>
  <div class="grid g2"><label class="f">Monto<input type="number" id="pp-m" value="${Math.max(0,saldoProv(PROV(pid)))}"></label><label class="f">Medio<select id="pp-med">${MEDIOS.filter(m=>m!=='Crédito').map(m=>`<option ${m==='Transferencia'?'selected':''}>${m}</option>`).join('')}</select></label></div>
  <p class="muted" style="font-size:12px">El pago se registra como egreso en caja y se descuenta de la cuenta corriente.</p>`,
  `<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" onclick="confirmarPago()">Registrar pago</button>`)}

function confirmarPago(){const pid=val('pp-p'),m=+val('pp-m'),med=val('pp-med'),p=PROV(pid);if(!(m>0))return toast('Monto inválido','err');
 p.cta.push({ts:Date.now(),tipo:'pago',detalle:med,monto:m});S.movs.unshift({id:uid(),ts:Date.now(),tipo:'pago_prov',concepto:`Pago a ${p.nombre}`,monto:m,medio:med,provId:pid});
 save();closeModal();render();toast(`Pago de ${money(m)} a ${p.nombre} registrado`,'ok')}

/* ---------- PROMOCIONES ---------- */
const TIPO_P={pct:['%','Descuento %'],'2x1':['2x1','2x1'],combo:['CMB','Combo'],medio:['$','Por medio de pago']};
function promoDesc(p){
 if(p.tipo==='pct'){const [k,v]=p.alcance.split(':');return `${p.pct}% de descuento en ${k==='cat'?'categoría '+v:P(v)?.nombre}`}
 if(p.tipo==='2x1')return `Llevás 2 ${P(p.pid)?.nombre}, pagás 1`;
 if(p.tipo==='combo'){const full=p.pids.reduce((a,id)=>a+P(id).precio,0);return `${p.pids.map(id=>P(id).nombre).join(' + ')} a ${money(p.precio)} <span class="muted">(antes ${money(full)})</span>`}
 return `${p.pct}% de descuento pagando con ${p.medio}`}
const diasTxt=d=>d.length===7?'Todos los días':d.length===5&&[1,2,3,4,5].every(x=>d.includes(x))?'Lunes a viernes':d.map(x=>DIAS[x]).join(', ');
VIEWS.promos=()=>{const dh=getDH();
 return `<div class="toolbar"><button class="btn pri" onclick="nuevaPromo()">+ Nueva promoción</button><div class="sp"></div>
  <div class="card row" style="padding:10px 14px"><b style="font-size:13px">Simular día y hora</b>
   <select id="sim-d" style="width:auto">${DIAS.map((d,i)=>`<option value="${i}" ${dh.dia===i?'selected':''}>${d}</option>`).join('')}</select>
   <input type="time" id="sim-h" value="${dh.hora}" style="width:auto">
   <button class="btn sm" onclick="S.sim={dia:+val('sim-d'),hora:val('sim-h')};save();render();toast('Horario simulado: las promos y precios se calculan con este día/hora')">Aplicar</button>
   ${S.sim?`<button class="btn sm" onclick="S.sim=null;save();render()">Usar hora real</button>`:''}</div></div>
 <div class="grid g2">${S.promos.map(p=>{const v=promoVigente(p,dh);return `<div class="card promo"><div class="ic">${TIPO_P[p.tipo][0]}</div><div style="flex:1;min-width:0">
   <div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b style="font-size:15px">${esc(p.nombre)}</b><label class="sw"><input type="checkbox" ${p.activa?'checked':''} onchange="togglePromo('${p.id}',this.checked)"><span></span></label></div>
   <div style="margin:4px 0 8px">${promoDesc(p)}</div>
   <div class="row"><span class="badge">${TIPO_P[p.tipo][1]}</span><span class="badge">${diasTxt(p.dias)}</span><span class="badge">${p.desde==='00:00'&&p.hasta==='24:00'?'Todo el día':p.desde+' a '+p.hasta}</span>
   ${!p.activa?'<span class="badge">Pausada</span>':v?'<span class="badge b-green">● Vigente ahora</span>':'<span class="badge b-amber">Fuera de horario</span>'}
   <span class="sp" style="flex:1"></span><button class="btn sm danger" onclick="borrarPromo('${p.id}')">Eliminar</button></div></div></div>`}).join('')}</div>
 <p class="muted" style="margin-top:16px">Las promociones vigentes se aplican solas al cobrar mesas, pedidos y ventas de mostrador. Probá abrir una mesa y agregar 2 cervezas en lata en horario de happy hour (18 a 21 h).</p>`;
};
function togglePromo(id,on){S.promos.find(p=>p.id===id).activa=on;save();render();toast(on?'Promoción activada':'Promoción pausada')}
function borrarPromo(id){if(!confirm('¿Eliminar esta promoción?'))return;S.promos=S.promos.filter(p=>p.id!==id);save();render()}
function nuevaPromo(){
 openModal('Nueva promoción',`<label class="f">Nombre visible<input type="text" id="np-n" placeholder="Ej: Jueves de milanesas"></label>
  <label class="f">Tipo<select id="np-t" onchange="promoFields()"><option value="pct">Descuento %</option><option value="2x1">2x1</option><option value="combo">Combo a precio fijo</option><option value="medio">Descuento por medio de pago</option></select></label>
  <div id="np-dyn"></div>
  <label class="f">Días<div class="dias">${DIAS.map((d,i)=>`<label><input type="checkbox" value="${i}" checked>${d}</label>`).join('')}</div></label>
  <div class="grid g2"><label class="f">Desde<input type="time" id="np-de" value="00:00"></label><label class="f">Hasta<input type="time" id="np-ha" value="23:59"></label></div>`,
  `<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" onclick="guardarPromo()">Crear promoción</button>`,'mid');promoFields()}
function promoFields(){const t=val('np-t'),opts=S.productos.map(p=>`<option value="${p.id}">${p.nombre}</option>`).join('');
 document.getElementById('np-dyn').innerHTML={
  pct:`<div class="grid g2"><label class="f">Porcentaje<input type="number" id="np-pct" value="15"></label><label class="f">Aplica a<select id="np-al"><optgroup label="Categoría">${CATS.map(c=>`<option value="cat:${c}">${c}</option>`).join('')}</optgroup><optgroup label="Producto">${S.productos.map(p=>`<option value="pid:${p.id}">${p.nombre}</option>`).join('')}</optgroup></select></label></div>`,
  '2x1':`<label class="f">Producto<select id="np-pid">${opts}</select></label>`,
  combo:`<div class="grid g3"><label class="f">Producto 1<select id="np-c1">${opts}</select></label><label class="f">Producto 2<select id="np-c2">${opts}</select></label><label class="f">Producto 3 (opcional)<select id="np-c3"><option value="">—</option>${opts}</select></label></div><label class="f">Precio del combo<input type="number" id="np-pr" value="15000"></label>`,
  medio:`<div class="grid g2"><label class="f">Porcentaje<input type="number" id="np-pct" value="10"></label><label class="f">Medio de pago<select id="np-med">${MEDIOS.map(m=>`<option>${m}</option>`).join('')}</select></label></div>`}[t]}
function guardarPromo(){const n=val('np-n').trim(),t=val('np-t');if(!n)return toast('Poné un nombre a la promoción','err');
 const dias=[...document.querySelectorAll('.dias input:checked')].map(x=>+x.value);if(!dias.length)return toast('Elegí al menos un día','err');
 let hasta=val('np-ha');if(hasta==='23:59')hasta='24:00';
 const p={id:uid(),nombre:n,tipo:t,dias,desde:val('np-de')||'00:00',hasta:hasta||'24:00',activa:true};
 if(t==='pct'){p.pct=+val('np-pct');p.alcance=val('np-al')}
 if(t==='2x1')p.pid=val('np-pid');
 if(t==='combo'){p.pids=[val('np-c1'),val('np-c2'),val('np-c3')].filter(Boolean);p.precio=+val('np-pr')}
 if(t==='medio'){p.pct=+val('np-pct');p.medio=val('np-med')}
 if((t==='pct'||t==='medio')&&!(p.pct>0&&p.pct<=100))return toast('Porcentaje inválido','err');
 S.promos.push(p);save();closeModal();render();toast('Promoción creada y activa','ok')}

/* ============ init ============ */
load();
if(!VIEWS[S.view])S.view='inicio';
render();setAuto();
setInterval(()=>{if(['salon','pedidos'].includes(S.view)&&!document.getElementById('ov').classList.contains('show')&&document.activeElement.tagName!=='INPUT')render()},60000);
</script>
</body>
</html>
